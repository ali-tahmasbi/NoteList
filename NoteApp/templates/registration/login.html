<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        {{ form.username.label }}
        {{ form.username }}
        {{ form.username.errors }}
        <hr>
        {{ form.password.label }}
        {{ form.password }}
        {{ form.password.errors }}
        <hr>
        <button type="submit">
            login
        </button>
        <a href="{% url 'register' %}">signup</a>
    </form>
</body>
</html>
